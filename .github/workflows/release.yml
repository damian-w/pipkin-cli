name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          sh scripts/install_test.sh
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          sh scripts/notices.sh
          sh scripts/build.sh "${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum pipkin* > SHA256SUMS)
          cp LICENSE NOTICE.md dist/
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Pipkin CLI $GITHUB_REF_NAME" --generate-notes
